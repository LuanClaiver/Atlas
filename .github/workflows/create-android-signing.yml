name: Criar assinatura Android (uma vez)
run-name: Criar assinatura permanente do Atlas

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite exatamente: CRIAR ASSINATURA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  criar-assinatura:
    if: ${{ github.event.inputs.confirmacao == 'CRIAR ASSINATURA' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          EXISTING_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -z "$EXISTING_KEYSTORE" || (echo "A assinatura permanente já está configurada. Não crie outra chave." && exit 1)
          test -n "$SIGNING_PASSWORD" || (echo "Crie primeiro o Secret SIGNING_PASSWORD." && exit 1)
          test "${#SIGNING_PASSWORD}" -ge 12 || (echo "SIGNING_PASSWORD precisa ter pelo menos 12 caracteres." && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Criar chave permanente
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir assinatura-atlas
          keytool -genkeypair -v \
            -keystore assinatura-atlas/atlas-upload.jks \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias smart-life \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Atlas, OU=Atlas Apps, O=LuanClaiver, L=Fortaleza, ST=Ceara, C=BR"
          base64 -w 0 assinatura-atlas/atlas-upload.jks > assinatura-atlas/ANDROID_KEYSTORE_BASE64.txt
          sha256sum assinatura-atlas/atlas-upload.jks > assinatura-atlas/SHA256.txt
          printf '%s\n' \
            'ARQUIVOS CONFIDENCIAIS - NÃO ENVIE AO REPOSITÓRIO' \
            '' \
            'Guarde atlas-upload.jks em pelo menos dois locais seguros.' \
            'Copie todo o conteúdo de ANDROID_KEYSTORE_BASE64.txt para o Secret ANDROID_KEYSTORE_BASE64.' \
            'Use a mesma senha de SIGNING_PASSWORD nos Secrets KEYSTORE_PASSWORD e KEY_PASSWORD.' \
            'Crie KEY_ALIAS com o valor smart-life.' \
            'Depois apague o Secret temporário SIGNING_PASSWORD e esta execução do workflow.' \
            > assinatura-atlas/LEIA-ME.txt
      - name: Disponibilizar assinatura por um dia
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Assinatura-Permanente
          path: assinatura-atlas/
          retention-days: 1
          if-no-files-found: error
